<div id="counter" style="margin-bottom: 10px; font-weight: bold;">
  Pessoas presentes: <span id="total">0</span>
</div>

<p>
  Evento: <strong id="eventoNome">Carregando...</strong>
</p>


<!-- 🔹 BOTÃO EXCEDENTES -->
<button
  id="btnExcedentes"
  style="
    display: none;
    background: transparent;
    border: 1px solid #ccc;
    color: #555;
    font-size: 12px;
    padding: 6px 10px;
    cursor: pointer;
    margin-bottom: 10px;
  "
>
  Controle de Entradas
</button>

<form id="checkinForm" autocomplete="off">
  <label>Nome do convidado</label>

  <input
    type="text"
    id="nome"
    placeholder="Digite o nome"
    required
  />

  <div
    id="suggestions"
    style="
      border: 1px solid #ccc;
      display: none;
      max-height: 150px;
      overflow-y: auto;
      background: #fff;
      position: absolute;
      width: 300px;
      z-index: 10;
    "
  ></div>

  <button type="submit">Check-in</button>
</form>

<div id="warning" style="display:none; color: orange; margin-top: 10px;">
  <span id="warningText"></span><br />
  <button id="btnProsseguir" style="margin-top: 6px; display:none;">
    Deseja prosseguir mesmo assim?
  </button>
</div>

<script src="./script.js"></script>
