<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Recepção Digital - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/static/login/login.css"/>
</head>
<body>

  <canvas id="stars"></canvas>

  <div class="login-container">
    <p class="welcome">BEM-VINDO AO</p>
    <h1>Espaço <span>MariAna</span></h1>
  
    <input type="text" id="username" placeholder="Usuário" />
    <input type="password" id="password" placeholder="Senha" />

    <button id="btnLogin">Entrar</button>

    <p id="message"></p>
  </div>

  <script type="module" src="/static/login/login.js"></script>
  <script src="/static/login/star.js"></script>
</body>
</html>
