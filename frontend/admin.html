<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Painel do Admin</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 30px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,.1);
    }

    button {
      padding: 10px 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-discreto {
      background: transparent;
      border: 1px solid #ccc;
      color: #555;
      font-size: 12px;
      padding: 6px 10px;
      margin-top: 12px;
      cursor: pointer;
      display: none; /* 🔴 começa escondido */
    }
  </style>
</head>
<body>

  <select id="eventSelect"></select>

  <h1>👑 Painel do Admin</h1>

  <div class="card">
    <h2>Criar Evento</h2>

    <input
      type="text"
      id="eventName"
      placeholder="Nome do evento"
    />
    <br /><br />

    <input
      type="date"
      id="eventDate"
    />
    <br /><br />

    <input
      type="number"
      id="eventCapacity"
      placeholder="Capacidade máxima"
      min="1"
    />
    <br /><br />

    <button type="button" id="btnCriarEvento">
      Criar Evento
    </button>
  </div>

  <div class="card">
    <h2>Importar Convidados (CSV)</h2>
    <input type="file" id="file" accept=".csv" />
    <br />
    <button type="button" id="btnImportar">
      Importar Lista
    </button>
  </div>

  <div class="card">
    <h2>Recepção</h2>

    <button type="button" id="btnRecepcao">
      Abrir Check-in
    </button>

    <br />

    <button
      type="button"
      id="btnExcedentes"
      class="btn-discreto"
    >
      Ver excedentes
    </button>
  </div>

  <script src="admin.js"></script>
</body>
</html>
