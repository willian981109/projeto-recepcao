<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Painel do Contador</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    #eventsContainer {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .event-card {
      background: #ffffff;
      border-radius: 10px;
      padding: 20px;
      width: 260px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .event-card h2 {
      margin: 0 0 10px 0;
      font-size: 18px;
    }

    .event-card p {
      font-size: 16px;
      margin: 0;
    }

    .total {
      font-size: 36px;
      font-weight: bold;
      margin-top: 10px;
      color: #2ecc71;
    }
  </style>
</head>
<body>

  <h1>📊 Painel do Contador</h1>

  <div id="eventsContainer">
    <p>Carregando eventos...</p>
  </div>

  <script src="contador.js"></script>
</body>
</html>
